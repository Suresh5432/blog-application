<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body>
<div class="login-container">
    <h1>Login</h1>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                    placeholder="Enter your password" required>
        </div>
        <span th:if="${param.error}" class="error-message">Invalid email or password</span>
        <button type="submit">Login</button>
    </form>
    <p class="login-link">
        Don't have an account? <a th:href="@{/register}">Register</a>
    </p>
    <br>
    <a th:href="@{/}" class="login-link">Back to Home</a>
</div>
</body>
</html>
