<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog Application</title>

    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>

<body>
<div class="page-container">

    <header class="app-header">

        <div class="app-name">My Blog Application</div>

        <div class="user-block">

<!--            <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="login">Login</a>-->

<!--            <a th:href="@{/logout}" sec:authorize="isAuthenticated()" class="login">Logout</a>-->

            <a th:href="@{/posts}" class="login">Back</a>

            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="login"
               th:if="${#authorization.expression('hasRole(''ADMIN'')')
                        or @postSecurity.isOwner(post.id,#authentication)}">Edit
            </a>


            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')
                        or @postSecurity.isOwner(post.id,#authentication)}">

                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                    onsubmit="return confirm('Are you sure you want to delete this post?');">

                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit" class="login" >Delete</button>

                </form>

            </div>

        </div>

    </header>
    <main class="blog-post">

        <h1 class="post-title" th:text="${post.title}">Blog post title</h1>

        <div class="post-info">

            <span>Author -</span>

            <span th:text="${post.author}">Author</span>

            <span>, </span><br>

            <span>Published Data -</span>

            <span th:text="${post.publishedAt==null?'-':
                        #temporals.format(post.publishedAt,'dd/MM/yyyy HH:mm a')}">Date</span>
        </div>
        <div class="post-content" th:text="${post.content}"></div>
    </main>
    <div class="post-tags">
        Tags
        <span class="tag" th:text="${post.tags}">Tags</span>
    </div>
    <div class="tag-comment">
        <div class="post-comment">
            <div class="comment-header">
                <h2>Comments</h2>
                <a th:href="@{/posts/{id}/comment(id=${post.id})}"
                   class="create-comment-btn">Create Comment</a>
            </div>
            <div class="no-comments" th:if="${#lists.isEmpty(post.comments)}">
                <p>No comments yet.</p>
            </div>
            <div class="comments-list" th:unless="${#lists.isEmpty(post.comments)}">
                <div class="comment" th:each="comment : ${post.comments}">
                    <div class="comment-top">
                        <div>
                            <h3 th:text="${comment.name}">UserName</h3>
                            <p class="comment-email" th:text="${comment.email}">user@email.com</p>
                        </div>
                        <span class="comment-date" th:text="${#temporals.format(comment.createdAt,'dd/MM/yyyy HH:mm a')}">Date
                        </span>
                    </div>
                    <p class="comment-text" th:text="${comment.comment}">Comment text</p>
                    <div class="comment-actions" th:if="${#authorization.expression('hasRole(''ADMIN'')')
                                or @postSecurity.isOwner(post.id,#authentication)}">
                        <a th:href="@{/posts/{postId}/comments/{commentId}/edit(
                                postId=${post.id},commentId=${comment.id})}"
                           class="update-comment">Update</a>
                        <form th:action="@{/posts/{postId}/comments/{commentId}/delete(
                                    postId=${post.id},
                                    commentId=${comment.id})}" method="post"
                              onsubmit="return confirm('Are you sure you want to delete this comment?');"
                              th:if="${#authorization.expression('hasRole(''ADMIN'')')
                                    or @postSecurity.isOwner(post.id,#authentication)}">
                            <button type="submit" class="delete-comment">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
