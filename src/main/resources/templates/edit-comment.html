<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Comment</title>
    <link rel="stylesheet" th:href="@{/css/comments.css}">
</head>
<body>
<div class="comment-page">
    <div class="comment-container">
        <h1>Edit Comment</h1>
        <form th:action="@{/posts/{postId}/comments/{commentId}/edit(
                            postId=${postId},
                            commentId=${comment.id})}" method="post" class="comment-form">
            <div class="form-group">
                <label for="comment">Comment</label>
                <textarea id="comment"
                          name="comment" rows="6" required
                          th:text="${comment.comment}">
                </textarea>
            </div>
            <button type="submit" style="width: 10%;height: 30px">
                Update Comment
            </button>
        </form>
        <br>
        <a th:href="@{/posts/{id}(id=${postId})}"
           class="back-link">
            ← Back to Post
        </a>
    </div>
</div>
</body>
</html>
