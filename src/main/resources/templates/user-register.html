<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body>
<div class="register-container">
    <h1>Create Account</h1>
    <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name"
                    placeholder="Enter your name" required th:field="*{name}">
            <span class="error-message" th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}"></span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"
                    placeholder="Enter your email" required>
            <span class="error-message" th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password"
                    name="password" placeholder="Enter your password"
                    required>
            <span class="error-message" th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"></span>
        </div>
        <button type="submit">Register</button>
    </form>
    <p class="login-link">Already have an account?<a th:href="@{/login}">Login</a>
    </p>
</div>
</body>
</html>
