<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>
    <link rel="stylesheet" href="/css/create-post.css">
</head>
<body>
<div class="page-container">
    <header class="header">
        <div class="site-title">My Blog Application</div>
        <a th:href="@{/}" class="back-link">Back to Posts</a>
    </header>
    <main class="create-post-container">
        <h1 th:text="${post.id == null ? 'Create Blog Post' : 'Edit Blog Post'}">
            Create Blog Post
        </h1>
        <form th:action="${post.id==null ? '/posts/create': '/posts/'+post.id+'/edit'}"
              method="post" class="post-form" th:object="${post}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title"
                        placeholder="Enter post title" required th:field="*{title}">
                <span th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}" class="error"></span>
            </div>
            <div class="form-group" sec:authorize="hasRole('ADMIN')">
                <label for="author">Author</label>
                <Select  id="author" name="author" required>
                    <option value="">Select Author</option>
                    <option th:each="author : ${allAuthors}"
                            th:value="${author.name}"
                            th:text="${author.name}">
                    </option>
                    </Select>
                <span th:if="${#fields.hasErrors('author')}"
                      th:errors="*{author}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags"
                        placeholder="Java, Spring, Hibernate" th:field="*{tags}">
                <span th:if="${#fields.hasErrors('tags')}"
                      th:errors="*{tags}" class="error"></span>
                <small>Enter tags separated by commas.</small>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content"
                        rows="12" placeholder="Write your blog post here..."
                        required th:field="*{content}"></textarea>
                <span th:if="${#fields.hasErrors('content')}"
                      th:errors="*{content}" class="error"></span>
            </div>
            <div class="form-actions">
                <a th:href="@{/newpost}" class="cancel-button">Cancel</a>
                <button type="submit" class="submit-button">Publish Post</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
